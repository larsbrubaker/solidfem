# cargo-nextest settings for `cargo nextest run --workspace`.
#
# How every crate lays its tests out: an area is one test binary, `crates/<crate>/tests/<area>.rs`,
# which pulls its files in with `#[path = "<area>/<file>.rs"] mod <file>;`, so a binary's tests
# share one build and one link. A test is named for the behaviour it pins.

[profile.default]
test-threads = "num-cpus"
# A hung test fails within 3 minutes instead of stalling the run.
slow-timeout = { period = "60s", terminate-after = 3 }
fail-fast = false

# CI's runners (`--profile ci`, `.github/workflows/ci.yml`): 3 or 4 CPUs, several times slower than
# a development machine, so a correct test there can pass the 3 minutes a hung test gets locally;
# it is stopped after 5.
[profile.ci]
slow-timeout = { period = "60s", terminate-after = 5 }
# The failures again at the end of the run, where a long CI log is read from.
failure-output = "immediate-final"

# The GPU kernel tests print `SKIPPED: ...` and pass on a machine without a GPU adapter (CI's
# runners have none); showing a passing test's output here keeps a skip from reading as a run.
# `SOLIDFEM_REQUIRE_GPU=1` turns the skip into a failure (crates/solidfem-solve/tests/solver/
# gpu_execution.rs). They run one at a time as a precaution: two full workspace runs failed with
# an access violation in one test process and "Parent device is lost" from the next ones to ask
# for a device. The cause is not known: 8 later full runs side by side did not reproduce it, so
# this does not show that parallel GPU tests are unsafe. It costs little, 7 short tests.
[[profile.default.overrides]]
filter = 'binary(solver) & test(/gpu_(cycle_)?execution::/)'
success-output = "immediate"
test-group = "gpu"

[test-groups]
gpu = { max-threads = 1 }

# solidfem-solve: sparse matrix storage and the resumable preconditioned conjugate gradient solver.
# No dependencies; the conjugate gradient loop is written here so its state can pause between steps.
[package]
name = "solidfem-solve"
description = "Sparse symmetric matrices and a resumable preconditioned conjugate gradient solver"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[lints]
workspace = true

# The GPU kernels' tests: naga parses and validates the WGSL on every target; wgpu runs it on the
# machine's GPU in a native-only test (the library itself has no GPU dependency).
[dev-dependencies]
naga = { version = "29", default-features = false, features = ["wgsl-in"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
wgpu = { version = "29", default-features = false, features = ["std", "wgsl", "dx12", "metal", "vulkan"] }
pollster = "0.4"

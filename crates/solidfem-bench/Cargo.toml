# solidfem-bench: measures what real inputs do to the mesher and the solver. Never published. The
# `solidfem-corpus` binary measures real triangle meshes, the solidmesh surface remesher and this
# workspace's volume mesher on the remeshed surfaces,
# natively only, through a path dependency on a solidmesh checkout with a version floor. The
# `solidfem-sliver` binary measures what bad boundary triangles cost a stress result. The
# `solidfem-gate` binary is the end-of-mesher gate: this workspace's mesher into the solver on a
# 100 x 100 x 0.8 mm plate. The `solidfem-preconditioner` binary compares the preconditioners.
# The `solidfem-benchmarks` binary runs real parts against closed-form and published references.
# The `solidfem-surfaces` binary regenerates the surfaces those benchmarks read.
[package]
name = "solidfem-bench"
description = "Measures real triangle meshes, sliver cost and the end-of-mesher gate for solidfem"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "solidfem-corpus"
path = "src/bin/corpus.rs"

[[bin]]
name = "solidfem-sliver"
path = "src/bin/sliver.rs"

[[bin]]
name = "solidfem-gate"
path = "src/bin/gate.rs"

[[bin]]
name = "solidfem-preconditioner"
path = "src/bin/preconditioner.rs"

[[bin]]
name = "solidfem-benchmarks"
path = "src/bin/benchmarks.rs"

[[bin]]
name = "solidfem-surfaces"
path = "src/bin/surfaces.rs"

[dependencies]
robust = "1.2"
solidfem = { path = "../solidfem", version = "0.1.0" }
solidfem-elastic = { path = "../solidfem-elastic", version = "0.1.0" }
solidfem-mesh = { path = "../solidfem-mesh", version = "0.1.0" }

# The corpus measurement runs on triangle meshes from solidmesh, natively only: the wasm build
# never sees it. Path dependencies with version floors, on the checkout CI puts beside this one.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libm = "0.2.16"
solidmesh = { path = "../../../solidmesh/crates/geometry-processing", version = "0.2.2" }
solidmesh-math = { path = "../../../solidmesh/crates/vector-math", version = "0.2.2" }
solidmesh-mesh = { path = "../../../solidmesh/crates/polygon-mesh", version = "0.2.2" }

[lints]
workspace = true

# demo/wasm, package solidfem-demo-wasm: the WebAssembly bindings behind the public demo page,
# where a visitor changes a part and sees its stress and how close it is to the textbook.
#
# A workspace member, as solidmesh's and manifold-rust's demo/wasm are: it builds with the pinned
# toolchain and the shared Cargo.lock, takes the workspace lints and inherited keys (the
# workspace-gates test `workspace_members` checks both), and clippy, fmt and the dependency gate
# cover it like any crate. It is not under crates/ because it is not a library anyone depends on,
# and it is never published (`publish = false`).
#
# It calls solidfem's documented API through the `solidfem` facade, and `solidfem-bench` for the
# real-part benchmark cases (the holds, loads and materials of the example parts), so the demo
# solves exactly what the benchmarks judge; `src/lib.rs` says what it adds (the offered parts, the
# textbook formulas, the slicing state machine and the render arrays).
[package]
name = "solidfem-demo-wasm"
description = "WebAssembly bindings for the solidfem demo page"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "solidfem_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
solidfem = { path = "../../crates/solidfem" }
solidfem-bench = { path = "../../crates/solidfem-bench" }
wasm-bindgen = "0.2"
js-sys = "0.3"
# Routes Rust panic messages (with location) to console.error: without it a panic surfaces only as
# an opaque "RuntimeError: unreachable".
console_error_panic_hook = "0.1"

# wasm-opt's default (-O) leaves speed on the table for a module this compute-heavy.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O3']

[lints]
workspace = true
